<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>DND</title>
  <style>
    :root {
      --purple: #5b21b6;
      --cream: #fdf3c8;               /* м'який жовтий, ближчий до білого */
    }
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #moon {
      display: flex; align-items: center; justify-content: center;
      width: 100vw; height: 100vh;
      padding: 0; margin: 0;
      border: 2px solid var(--purple);
      border-radius: 50%;
      background: var(--cream);        /* звичайний режим: світлий фон, фіолетовий місяць */
      color: var(--purple);
      cursor: grab;
      user-select: none;
      -webkit-user-drag: none;
      outline: none;
      touch-action: none;
    }
    #moon svg { width: 60%; height: 60%; pointer-events: none; }
    #moon:hover { filter: brightness(0.96); }
    #moon:active { cursor: grabbing; }
    #moon.on {                         /* "не турбувати": фіолетовий фон, світлий місяць */
      background: var(--purple);
      color: var(--cream);
      border-color: var(--cream);
    }
  </style>
</head>
<body>
  <button id="moon" type="button" title="Слова активні. Клік — не турбувати. Тягни, щоб перемістити.">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <script>
    const moon = document.getElementById('moon');
    let startX = 0, startY = 0, pressed = false, dragged = false;

    moon.addEventListener('pointerdown', (e) => {
      pressed = true; dragged = false;
      startX = e.screenX; startY = e.screenY;
      moon.setPointerCapture(e.pointerId);
      window.api.moonDragStart();
    });
    moon.addEventListener('pointermove', (e) => {
      if (!pressed) return;
      const dx = e.screenX - startX, dy = e.screenY - startY;
      if (!dragged && Math.hypot(dx, dy) < 4) return; // маленький рух = ще клік, не перетягування
      dragged = true;
      window.api.moonDragMove(dx, dy);
    });
    moon.addEventListener('pointerup', () => { pressed = false; });

    moon.addEventListener('click', () => {
      if (dragged) { dragged = false; return; }        // після перетягування клік не рахуємо
      window.api.moonClick();
    });

    window.api.onDnd((on) => {
      moon.classList.toggle('on', on);
      moon.title = on
        ? 'Не турбувати: слова не показуються. Клік — увімкнути слова.'
        : 'Слова активні. Клік — не турбувати. Тягни, щоб перемістити.';
    });
  </script>
</body>
</html>
