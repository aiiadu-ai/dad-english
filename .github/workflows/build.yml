name: Build

# Запускається вручну (вкладка Actions → Build → Run workflow): збирає обидві версії
# і кладе їх у "Artifacts" цього запуску.
# Коли створюють тег виду v1.0.0 — додатково публікує Release зі збірками для скачування.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      # без сертифіката Apple: не шукати підпис у зв'язці ключів
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Встановити залежності (за package-lock.json)
        run: npm ci

      - name: Перевірити логіку вивчення
        run: npm test

      - name: Зібрати .dmg (Intel + Apple Silicon)
        run: npm run dist:mac

      - name: Завантажити .dmg як artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Встановити залежності (за package-lock.json)
        run: npm ci

      - name: Перевірити логіку вивчення
        run: npm test

      - name: Зібрати .zip для Windows
        run: npm run dist:win

      - name: Завантажити .zip як artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-windows-zip
          path: dist/*.zip
          if-no-files-found: error

  # Лише для тегів v*: збирає обидва файли на сторінці Releases
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Забрати збірки
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Створити Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "English $GITHUB_REF_NAME" \
            --notes "Завантаж файл для своєї системи: **English-...-win-x64.zip** для Windows, **English-...-universal.dmg** для Mac. Інструкція зі встановлення — у README."
