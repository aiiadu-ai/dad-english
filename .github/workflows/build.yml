name: Build

# Запускається вручну (вкладка Actions → Build → Run workflow): збирає обидві версії
# і кладе їх у "Artifacts" цього запуску.
# Коли створюють тег виду v1.0.0 — додатково публікує Release зі збірками для скачування.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      # без сертифіката Apple: не шукати підпис у зв'язці ключів
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Встановити залежності (за package-lock.json)
        run: npm ci

      - name: Перевірити логіку вивчення
        run: npm test

      - name: Зібрати .dmg (Intel + Apple Silicon)
        run: npm run dist:mac

      - name: Завантажити .dmg як artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Встановити залежності (за package-lock.json)
        run: npm ci

      - name: Перевірити логіку вивчення
        run: npm test

      - name: Зібрати .zip для Windows
        run: npm run dist:win

      - name: Завантажити .zip як artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-windows-zip
          path: dist/*.zip
          if-no-files-found: error

  # Лише для тегів v*: збирає обидва файли на сторінці Releases
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Забрати збірки
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Створити Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSTALL=$(cat <<'EOF'
          ## Як завантажити
          Прокрути цю сторінку вниз до розділу **Assets** і натисни **один** файл:
          - **Mac:** файл, що закінчується на `-universal.dmg`
          - **Windows:** файл, що закінчується на `-win-x64.zip`

          Інші рядки (наприклад, «Source code») не потрібні.

          ## Як встановити на Mac
          1. Відкрий завантажений файл `.dmg` і перетягни **English** у папку **Applications**.
          2. Відкрий English з Applications. Коли macOS скаже, що не може перевірити програму, натисни **«Готово»**.
          3. Відкрий **Системні налаштування → Конфіденційність і безпека**, знайди повідомлення про English і натисни **«Все одно відкрити»**.
          4. Якщо пише, що програма «пошкоджена»: відкрий Термінал і виконай `xattr -cr /Applications/English.app`, потім відкрий English ще раз.

          ## Як встановити на Windows
          1. Клацни на завантаженому `.zip` правою кнопкою → **«Видобути все»** у постійну папку (наприклад, на робочий стіл).
          2. Відкрий папку й двічі клікни **English.exe**.
          3. Якщо Windows пише «Windows protected your PC»: **«Докладніше»** → **«Все одно виконати»**.
          EOF
          )
          TITLE="English $GITHUB_REF_NAME"
          HEAD="Слово з'являється кожні **15 хвилин**."
          FLAGS=""
          case "$GITHUB_REF_NAME" in
            # теги виду v1.0.2-hourly — окрема версія з паузою 1 година.
            # Це "попередній" реліз, щоб він не ставав "Latest" і кнопка в README вела на звичайну версію.
            *-hourly)
              TITLE="English $GITHUB_REF_NAME — версія з паузою 1 година"
              HEAD="Це версія, де слово з'являється раз на **1 годину** (у звичайній версії — кожні 15 хвилин)."
              FLAGS="--prerelease"
              ;;
          esac
          NOTES="$HEAD

          $INSTALL"
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "$NOTES" \
            $FLAGS
