name: Build Mac

# Запускається вручну (вкладка Actions → Build Mac → Run workflow)
# або автоматично, коли створюють тег виду v1.0.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      # без сертифіката Apple: не шукати підпис у зв'язці ключів
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Встановити залежності (за package-lock.json)
        run: npm ci

      - name: Перевірити логіку вивчення
        run: npm test

      - name: Зібрати .dmg (Intel + Apple Silicon)
        run: npm run dist:mac

      - name: Завантажити .dmg як artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error
